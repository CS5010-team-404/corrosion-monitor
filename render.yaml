# Render Blueprint for Corrosion Watch. Must be at the ROOT of the repository.
#
#   corrosion-watch-api       team backend (Docker): auth, analytics, alerts, audit, reports, admin
#   corrosion-watch-platform  data platform (Docker): device ingestion, sensor health, simulator, forecast
#   corrosion-watch-web       React frontend (static site, free, on Render's CDN)
#
# All three share one MySQL database (Aiven free tier) and one JWT secret, so a single sign-in works everywhere.
# Before the first deploy, check the backend block against the team's actual Dockerfile and env var names
# (Claude Code phase 1 does this). If the backend already exists on Render, use its exact service name.
# Cost: two Starter web services ($7/month each) from the $100 credit; the static site is free.

envVarGroups:
  - name: corrosion-watch-shared
    envVars:
      - key: ECP_JWT_SECRET          # HS256 signing key; the backend signs tokens, the platform validates them
        generateValue: true

services:
  # ---------------------------------------------------------------- team backend (existing code)
  - type: web
    name: corrosion-watch-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile     # adjust to the backend's Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    buildFilter:
      ignoredPaths: ["frontend/**", "platform/**", "docs/**", "devices/**", "scripts/**"]
    envVars:
      - fromGroup: corrosion-watch-shared
      - key: ECP_DB_URL              # jdbc:mysql://HOST:PORT/defaultdb?sslMode=REQUIRED&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
        sync: false
      - key: ECP_DB_USER
        sync: false
      - key: ECP_DB_PASSWORD
        sync: false
      - key: ECP_DB_POOL             # Aiven free tier allows few connections; keep pools small
        value: "5"
      - key: FRONTEND_HOST
        fromService: { type: web, name: corrosion-watch-web, property: host }

  # ---------------------------------------------------------------- data platform
  - type: web
    name: corrosion-watch-platform
    runtime: docker
    plan: starter                    # never sleeps: the simulator and health checks run continuously
    dockerfilePath: ./deploy/platform.Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    buildFilter:
      paths: ["platform/**", "deploy/platform.Dockerfile"]
    envVars:
      - fromGroup: corrosion-watch-shared
      - key: ECP_DB_URL
        sync: false
      - key: ECP_DB_USER
        sync: false
      - key: ECP_DB_PASSWORD
        sync: false
      - key: ECP_DB_POOL
        value: "4"
      - key: ECP_SECRET_KEY          # encrypts device HMAC keys at rest
        generateValue: true
      - key: ECP_SECRET_SALT         # hex, for example from: openssl rand -hex 8
        sync: false
      - key: ECP_JWT_ROLES_CLAIM     # claim in the backend's JWT that lists roles
        value: roles
      - key: ECP_SIMULATOR_ENABLED
        value: "true"
      - key: FRONTEND_HOST
        fromService: { type: web, name: corrosion-watch-web, property: host }

  # ---------------------------------------------------------------- frontend
  - type: web
    name: corrosion-watch-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install --no-audit --no-fund && npm run build    # use "npm ci" once package-lock.json is committed
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: VITE_API_URL
        fromService: { type: web, name: corrosion-watch-api, property: host }
      - key: VITE_PLATFORM_URL
        fromService: { type: web, name: corrosion-watch-platform, property: host }
      - key: NODE_VERSION
        value: "22"
