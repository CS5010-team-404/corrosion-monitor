# Local MySQL + MailHog for the team backend. The backend creates the schema with Flyway when it starts
# (backend/src/main/resources/db/migration). docker-compose.platform.yml includes this file, so the backend and the
# platform share this one database. Values come from .env (copy .env.example); the fallbacks match .env.example.
services:
  db:
    image: mysql:8.4   # Aiven runs MySQL 8.4 (docs/DEPLOYMENT.md)
    container_name: corrosion-db
    # Same settings as production (Aiven, checked by hand; docs/DEPLOYMENT.md), so SQL that works here works there.
    # log_bin_trust_function_creators lets the app account create the audit_log triggers (V1).
    command:
      - --sql-mode=REAL_AS_FLOAT,PIPES_AS_CONCAT,ANSI_QUOTES,IGNORE_SPACE,ONLY_FULL_GROUP_BY,ANSI,STRICT_ALL_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      - --sql-require-primary-key=ON
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      MYSQL_DATABASE: corrosion_monitor
      MYSQL_USER: ${MYSQL_USER:-app_rw}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-app}
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Catches alert emails locally. Web inbox at http://localhost:8025
  mailhog:
    image: mailhog/mailhog
    container_name: corrosion-mail
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db_data:
