name: platform
on:
  push: { branches: [main], paths: ["platform/**", "deploy/platform.Dockerfile", ".github/workflows/platform.yml"] }
  pull_request: { paths: ["platform/**", "deploy/platform.Dockerfile", ".github/workflows/platform.yml"] }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - run: mvn -B -f platform/pom.xml verify
      # One aggregated JaCoCo report for all platform modules; totals in the log and the run summary.
      - name: Coverage
        run: |
          python3 scripts/coverage-summary.py platform/ecp-platform-app/target/site/jacoco-aggregate/jacoco.csv | tee coverage.txt
          { echo '### Platform coverage'; echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: platform-coverage, path: "platform/ecp-platform-app/target/site/jacoco-aggregate/", if-no-files-found: ignore }
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/platform.Dockerfile -t corrosion-watch-platform .
