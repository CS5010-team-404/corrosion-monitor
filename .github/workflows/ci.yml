name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Testcontainers can start MySQL because Docker is available on GitHub's Ubuntu runners.
      - name: Build and test
        run: mvn -B verify

      # JaCoCo report from `mvn verify` (backend/target/site/jacoco); totals in the log and the run summary.
      - name: Coverage
        run: |
          python3 scripts/coverage-summary.py backend/target/site/jacoco/jacoco.csv | tee coverage.txt
          { echo '### Backend coverage'; echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-coverage, path: backend/target/site/jacoco/, if-no-files-found: ignore }
