# Test-only defaults, merged over src/main/resources/application.properties (Spring Boot reads both this classpath:/config/
# file and the classpath:/ one). A test that sets the same property in @SpringBootTest(properties = ...) wins.
#
# The analytics job writes risk_assessments and alert_signals on a timer. Tests that look at those tables must not have
# it running in the background, so it is off everywhere and the tests that need it call AnalyticsJob.runOnce() themselves.
ecp.analytics.signals.enabled=false
