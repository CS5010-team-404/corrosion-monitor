spring.application.name=corrosion-monitor

# Database (values come from environment variables; defaults match docker-compose.yml)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/corrosion_monitor?serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:app_rw}
spring.datasource.password=${MYSQL_PASSWORD:}

# The schema comes from Flyway (src/main/resources/db/migration), so Hibernate only checks it matches the entities
spring.jpa.hibernate.ddl-auto=validate
# The platform shares this database with its own history table (flyway_platform_history). If it migrated first,
# the schema is not empty, so start this history at version 0 and still apply V1 onwards.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Sign-in tokens: HS256 with the secret shared with the platform (Render env group corrosion-watch-shared).
# No default on purpose: the backend refuses to start without a secret of at least 32 bytes.
ecp.security.jwt-secret=${ECP_JWT_SECRET:}

# Demo users (one per role) on an empty app_user table. No default password: nothing is created without one.
ecp.demo.seed=${ECP_DEMO_SEED:true}
ecp.demo.password=${ECP_DEMO_PASSWORD:}

# Alert emails go to MailHog (inbox at http://localhost:8025)
spring.mail.host=localhost
spring.mail.port=1025

server.port=8080

# Only the health endpoint, for the Render health check. Mail is not part of health: there is no SMTP server on
# Render, and a DOWN mail check would make Render restart a backend that works.
management.endpoints.web.exposure.include=health
management.health.mail.enabled=false
