spring.application.name=corrosion-monitor

# Database (values come from environment variables; defaults match docker-compose.yml)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/corrosion_monitor?serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:app_rw}
spring.datasource.password=${MYSQL_PASSWORD:}
# Aiven's free tier allows few connections and the platform shares them: keep the pool small
spring.datasource.hikari.maximum-pool-size=${DB_POOL:5}

# The schema comes from Flyway (src/main/resources/db/migration), so Hibernate only checks it matches the entities
spring.jpa.hibernate.ddl-auto=validate
# The platform shares this database with its own history table (flyway_platform_history). If it migrated first,
# the schema is not empty, so start this history at version 0 and still apply V1 onwards.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Sign-in tokens: HS256 with the secret shared with the platform (Render env group corrosion-watch-shared).
# No default on purpose: the backend refuses to start without a secret of at least 32 bytes.
ecp.security.jwt-secret=${ECP_JWT_SECRET:}

# Demo users (one per role) on an empty app_user table. No default password: nothing is created without one.
ecp.demo.seed=${ECP_DEMO_SEED:true}
ecp.demo.password=${ECP_DEMO_PASSWORD:}

# Escalation emails. Locally they go to MailHog (inbox at http://localhost:8025); in production to any SMTP service
# set through these environment variables (docs/DEPLOYMENT.md). With a username the sender signs in, and STARTTLS is
# used whenever the server offers it. The timeouts keep a slow or unreachable server from holding up the escalation
# job: sending is best effort, and the escalation is saved before the email goes out.
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
ecp.alerts.mail-from=${ECP_ALERTS_MAIL_FROM:alerts@corrosionwatch.app}

# Render sends traffic to $PORT
server.port=${PORT:8080}

# Only the health endpoint, for the Render health check. Mail is not part of health: email is best effort, and a DOWN
# mail check during an SMTP outage would make Render restart a backend that works.
management.endpoints.web.exposure.include=health
management.health.mail.enabled=false

# Let a running audit job finish (up to 20 s) before the scheduler and the database connection pool close.
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=20s
