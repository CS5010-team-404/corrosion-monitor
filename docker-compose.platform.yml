# Local stack for the data platform: the team's MySQL + MailHog (docker-compose.yml) plus the platform service
# (with the embedded simulator). One MySQL on 3306 is shared with the team backend; each service runs its own
# Flyway history in the same corrosion_monitor database.
#   docker compose -f docker-compose.platform.yml up --build
# Then run the backend against the same database (mvn -pl backend spring-boot:run, port 8080) and the frontend with
# `cd frontend && npm run dev` (proxies to :8080 and :8081).
include:
  - docker-compose.yml

services:
  platform:
    build: { context: ., dockerfile: deploy/platform.Dockerfile }
    depends_on: { db: { condition: service_healthy } }
    environment:
      ECP_DB_URL: jdbc:mysql://db:3306/corrosion_monitor?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&useSSL=false
      ECP_DB_USER: ${MYSQL_USER:-app_rw}
      ECP_DB_PASSWORD: ${MYSQL_PASSWORD:-change-me-app}
      ECP_PLATFORM_AUTH: none        # local only; on Render it validates the team backend's JWT
      PORT: 8081
    ports: ["8081:8081"]
